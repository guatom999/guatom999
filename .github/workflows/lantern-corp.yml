name: Generate Green Lantern

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: greenlantern-output

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Green Lantern animations
        uses: guatom999/github-greenlantern@main
        with:
          github_user_name: ${{ github.repository_owner }}
          output_directory: dist

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
